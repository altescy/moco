name: Release Build

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: moco
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: moco
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: moco.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2.8.2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          ASSET_NAME="moco-${TAG}-${TARGET}.${ARCHIVE_EXT}"
          mkdir -p dist
          cp "target/${TARGET}/release/${BIN_NAME}" dist/
          tar -C dist -czf "$ASSET_NAME" "$BIN_NAME"
          echo "ASSET_PATH=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          $assetName = "moco-$env:TAG-$env:TARGET.$env:ARCHIVE_EXT"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:BIN_NAME" "dist/$env:BIN_NAME" -Force
          Compress-Archive -Path "dist/$env:BIN_NAME" -DestinationPath $assetName -Force
          "ASSET_PATH=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload release asset
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: ${{ env.ASSET_PATH }}
          overwrite_files: true
